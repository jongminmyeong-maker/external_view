<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>캐릭터챗 외부이미지 미리보기</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #12181f; color: #e2e8f0; padding: 1.2rem 0.8rem; min-height: 100vh; display: flex; flex-direction: column; }
        .main-container { max-width: 1100px; width: 100%; margin: 0 auto; flex: 1; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.2rem; color: #ffffff; text-align: center; }
        
        /* 캐릭터 / 의상 / 상황 코드 3열 배치 */
        .code-inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 0.8rem; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.8rem; color: #94a3b8; font-weight: 600; white-space: nowrap; }
        input[type="text"] { width: 100%; padding: 10px 10px; background-color: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #ffffff; font-size: 0.85rem; outline: none; }
        input[type="text"]:focus { border-color: #38bdf8; }

        /* URL 입력 및 버튼 세로 정렬 구도 */
        .url-section { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; width: 100%; }
        .url-input-container { width: 100%; }
        
        /* 버튼 3개 균등 분배 */
        .button-group { display: flex; gap: 6px; width: 100%; }
        button { flex: 1; padding: 10px 4px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; border: none; cursor: pointer; white-space: nowrap; text-align: center; }
        .btn-share { background-color: #334155; color: #ffffff; }
        .btn-shortcut { background-color: #64748b; color: #ffffff; }
        .btn-generate { background-color: #007bff; color: #ffffff; }

        /* 요약 바 모바일 반응형 */
        .summary-bar { display: flex; background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px 14px; margin-bottom: 1.2rem; font-size: 0.85rem; color: #94a3b8; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
        .summary-bar span strong { color: #38bdf8; }
        .summary-bar .invalid-count { color: #f87171; cursor: pointer; text-decoration: underline; }

        /* 갤러리 카드 반응형 */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .char-card { background-color: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; cursor: pointer; display: flex; flex-direction: column; }
        .img-wrapper { width: 100%; height: 180px; background-color: #0b0f17; display: flex; align-items: center; justify-content: center; padding: 6px; position: relative; }
        .img-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
        .char-card-info { padding: 8px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; }
        .char-card-title { color: #38bdf8; font-size: 0.9rem; font-weight: bold; }
        .char-card-badge { display: inline-block; background-color: #0f172a; color: #94a3b8; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; align-self: flex-start; }

        /* 모달 반응형 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); justify-content: center; align-items: center; padding: 12px; }
        .modal-content { background-color: #162447; padding: 1.2rem; border-radius: 12px; width: 100%; max-width: 1050px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid #1f4068; padding-bottom: 0.6rem; }
        .modal-title { font-size: 1.1rem; color: #38bdf8; font-weight: bold; }
        .close-btn { font-size: 1.5rem; color: #cbd5e1; cursor: pointer; border: none; background: none; padding: 0 4px; }
        .modal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        .modal-card { background-color: #0f172a; border-radius: 8px; overflow: hidden; border: 1px solid #1f4068; display: flex; flex-direction: column; }
        .modal-card .img-wrapper { height: 160px; cursor: pointer; }
        .modal-card-info { padding: 8px; font-size: 0.75rem; color: #94a3b8; display: flex; flex-direction: column; gap: 6px; justify-content: space-between; flex: 1; }
        .btn-copy-single { background-color: #0284c7; color: #ffffff; padding: 6px 8px; font-size: 0.7rem; border-radius: 4px; border: none; cursor: pointer; width: 100%; text-align: center; }
        .btn-copy-single:active { background-color: #0369a1; }

        /* 이미지 확대 반응형 모달 */
        .zoom-modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.95); justify-content: center; align-items: center; }
        .zoom-modal img { max-width: 95vw; max-height: 85vh; object-fit: contain; }
        .zoom-close-btn { position: absolute; top: 15px; right: 20px; font-size: 2rem; color: #ffffff; cursor: pointer; }

        /* 오류 모달 전용 표 모바일 스크롤 처리 */
        #invalidContainer { width: 100%; overflow-x: auto; }
        .invalid-list-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.75rem; min-width: 450px; }
        .invalid-list-table th, .invalid-list-table td { padding: 6px 8px; border: 1px solid #1f4068; text-align: left; }
        .invalid-list-table th { background-color: #0f172a; color: #f87171; }
        .invalid-list-table tr:nth-child(even) { background-color: #111d33; }
        .invalid-url-text { word-break: break-all; color: #cbd5e1; font-family: monospace; }
        .btn-copy-invalid { background-color: #dc2626; color: #fff; padding: 8px 12px; font-size: 0.8rem; margin-bottom: 8px; width: 100%; }

        /* 📱 768px 이하 모바일 전용 세부 조정 */
        @media (max-width: 768px) {
            h1 { font-size: 1.3rem; margin-bottom: 1rem; }
            .summary-bar { flex-direction: column; align-items: flex-start; gap: 6px; }
            .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .modal-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        }

        /* 📱 360px 이하 아주 작은 화면 대응 */
        @media (max-width: 360px) {
            .code-inputs { grid-template-columns: 1fr; }
            button { font-size: 0.75rem; padding: 8px 2px; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <h1>캐릭터챗 외부이미지 미리보기</h1>

    <div class="code-inputs">
        <div class="input-group">
            <label for="charCode">캐릭터 코드</label>
            <input type="text" id="charCode" value="A01..A05">
        </div>
        <div class="input-group">
            <label for="outfitCode">의상 코드</label>
            <input type="text" id="outfitCode" value="1,2">
        </div>
        <div class="input-group">
            <label for="situationCode">상황 코드</label>
            <input type="text" id="situationCode" value="00..05">
        </div>
    </div>

    <div class="url-section">
        <div class="input-group url-input-container">
            <label for="templateUrl">템플릿 URL</label>
            <input type="text" id="templateUrl" value="https://si-ran.com/gg/캐릭터-의상-상황.webp">
        </div>
        <div class="button-group">
            <button class="btn-share" onclick="copyShareUrl()">🔗 URL 공유</button>
            <button class="btn-shortcut" onclick="downloadFileList()">↓ 바로가기</button>
            <button class="btn-generate" onclick="generateList()">☰ 목록생성</button>
        </div>
    </div>

    <div class="summary-bar" id="summaryBar">
        <span>검색 캐릭터: <strong id="totalCharCount">0</strong>명</span>
        <span>실제 유효 이미지: <strong id="totalImgCount">0</strong>장</span>
        <span>제외된 이미지(오류): <strong id="totalInvalidCount" class="invalid-count" onclick="openInvalidModal()">0</strong>장 🔍</span>
    </div>

    <div class="gallery-grid" id="gallery"></div>
</div>

<!-- 상세 보기 모달 -->
<div class="modal" id="detailModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">캐릭터 미리보기</div>
            <button class="close-btn" onclick="closeModal('detailModal')">✕</button>
        </div>
        <div class="modal-grid" id="modalGrid"></div>
    </div>
</div>

<!-- 제외된/오류 URL 전용 모달 -->
<div class="modal" id="invalidModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title" style="color: #f87171;">제외된 이미지/오류 URL 목록</div>
            <button class="close-btn" onclick="closeModal('invalidModal')">✕</button>
        </div>
        <button class="btn-copy-invalid" onclick="copyInvalidUrls()">📋 오류 URL 목록 전체 복사</button>
        <div id="invalidContainer">
            <table class="invalid-list-table">
                <thead>
                    <tr>
                        <th style="width: 30%;">캐릭터/의상/상황</th>
                        <th style="width: 25%;">사유</th>
                        <th style="width: 45%;">URL</th>
                    </tr>
                </thead>
                <tbody id="invalidTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="zoom-modal" id="zoomModal" onclick="closeZoomModal()">
    <span class="zoom-close-btn" onclick="closeZoomModal()">&times;</span>
    <img id="zoomImg" src="" alt="확대 이미지">
</div>

<script>
    let globalCharData = {};
    let orderedCharList = [];
    let invalidImgList = [];

    const ERROR_BANNER_SIZES = [
        [300, 150]
    ];

    window.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        if (params.has('char')) document.getElementById('charCode').value = params.get('char');
        if (params.has('outfit')) document.getElementById('outfitCode').value = params.get('outfit');
        if (params.has('sit')) document.getElementById('situationCode').value = params.get('sit');
        if (params.has('url')) document.getElementById('templateUrl').value = params.get('url');

        if (params.has('char') || params.has('url')) {
            generateList();
        }
    });

    function parsePattern(inputStr) {
        if (!inputStr || !inputStr.trim()) return [''];
        const results = [];
        const parts = inputStr.split(',');

        parts.forEach(part => {
            part = part.trim();
            if (part.includes('..')) {
                const [startStr, endStr] = part.split('..').map(s => s.trim());
                if (/^\d+$/.test(startStr) && /^\d+$/.test(endStr)) {
                    const startNum = parseInt(startStr, 10);
                    const endNum = parseInt(endStr, 10);
                    const targetLen = startStr.length;
                    const step = startNum <= endNum ? 1 : -1;
                    for (let i = startNum; startNum <= endNum ? i <= endNum : i >= endNum; i += step) {
                        results.push(String(i).padStart(targetLen, '0'));
                    }
                } else if (/^[A-Za-z]+$/.test(startStr) && /^[A-Za-z]+$/.test(endStr)) {
                    const isStartLower = startStr === startStr.toLowerCase();
                    const isEndLower = endStr === endStr.toLowerCase();
                    const alphaToNum = (s) => {
                        let val = 0;
                        for (let i = 0; i < s.length; i++) val = val * 26 + (s.toUpperCase().charCodeAt(i) - 64);
                        return val;
                    };
                    const numToAlpha = (n, isLower) => {
                        let s = '';
                        while (n > 0) {
                            let m = (n - 1) % 26;
                            s = String.fromCharCode(65 + m) + s;
                            n = (n - m - 1) / 26;
                        }
                        return isLower ? s.toLowerCase() : s;
                    };
                    const startNum = alphaToNum(startStr);
                    const endNum = alphaToNum(endStr);
                    const step = startNum <= endNum ? 1 : -1;
                    for (let i = startNum; startNum <= endNum ? i <= endNum : i >= endNum; i += step) {
                        results.push(numToAlpha(i, isStartLower && isEndLower));
                    }
                } else {
                    const matchStart = startStr.match(/^([A-Za-z_-]*)(0*\d+)([A-Za-z_-]*)$/);
                    const matchEnd = endStr.match(/^([A-Za-z_-]*)(0*\d+)([A-Za-z_-]*)$/);
                    if (matchStart && matchEnd && matchStart[1] === matchEnd[1] && matchStart[3] === matchEnd[3]) {
                        const prefix = matchStart[1];
                        const suffix = matchStart[3];
                        const startNumStr = matchStart[2];
                        const endNumStr = matchEnd[2];
                        const startNum = parseInt(startNumStr, 10);
                        const endNum = parseInt(endNumStr, 10);
                        const targetLen = startNumStr.length;
                        const step = startNum <= endNum ? 1 : -1;
                        for (let i = startNum; startNum <= endNum ? i <= endNum : i >= endNum; i += step) {
                            results.push(`${prefix}${String(i).padStart(targetLen, '0')}${suffix}`);
                        }
                    } else {
                        results.push(part);
                    }
                }
            } else if (part !== '') {
                results.push(part);
            }
        });
        return results.length > 0 ? results : [''];
    }

    function preloadAndValidateImage(url) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const w = img.naturalWidth;
                const h = img.naturalHeight;

                if (!w || !h || w < 50 || h < 50) {
                    resolve({ isValid: false, reason: `크기 미달 (${w}x${h})` });
                    return;
                }

                const isErrorBanner = ERROR_BANNER_SIZES.some(([ew, eh]) => ew === w && eh === h);
                if (isErrorBanner) {
                    resolve({ isValid: false, reason: `오류 배너 (${w}x${h})` });
                    return;
                }

                resolve({ isValid: true, width: w, height: h });
            };
            img.onerror = () => resolve({ isValid: false, reason: '로드 실패 (404 등)' });
            img.src = url;
        });
    }

    async function generateList() {
        const charInput = document.getElementById('charCode').value;
        const outfitInput = document.getElementById('outfitCode').value;
        const situationInput = document.getElementById('situationCode').value;
        const templateUrl = document.getElementById('templateUrl').value;

        const gallery = document.getElementById('gallery');
        const chars = parsePattern(charInput);
        const outfits = parsePattern(outfitInput);
        const situations = parsePattern(situationInput);

        orderedCharList = chars.filter(c => c !== '');
        gallery.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #38bdf8; padding: 2rem;">🚀 검사 중입니다...</div>'; 
        globalCharData = {};
        invalidImgList = [];

        const BATCH_SIZE = 8;
        let totalValidImgCount = 0;

        for (const c of orderedCharList) {
            const pendingTasks = [];
            for (const o of outfits) {
                for (const s of situations) {
                    let finalUrl = templateUrl.replace(/캐릭터/g, c);
                    if (o === '') finalUrl = finalUrl.replace(/-의상/g, '').replace(/의상-/g, '').replace(/의상/g, '');
                    else finalUrl = finalUrl.replace(/의상/g, o);
                    finalUrl = finalUrl.replace(/상황/g, s);
                    pendingTasks.push({ char: c, outfit: o, situation: s, url: finalUrl });
                }
            }

            const validatedResults = [];
            for (let i = 0; i < pendingTasks.length; i += BATCH_SIZE) {
                const chunk = pendingTasks.slice(i, i + BATCH_SIZE);
                const chunkResults = await Promise.all(
                    chunk.map(async (task) => {
                        const res = await preloadAndValidateImage(task.url);
                        if (res.isValid) {
                            return { ...task, width: res.width, height: res.height };
                        } else {
                            invalidImgList.push({ ...task, reason: res.reason });
                            return null;
                        }
                    })
                );
                validatedResults.push(...chunkResults);
            }

            const validItems = validatedResults.filter(item => item !== null);
            if (validItems.length > 0) {
                globalCharData[c] = validItems;
                totalValidImgCount += validItems.length;
            }

            document.getElementById('totalCharCount').innerText = Object.keys(globalCharData).length;
            document.getElementById('totalImgCount').innerText = totalValidImgCount;
            document.getElementById('totalInvalidCount').innerText = invalidImgList.length;
        }

        gallery.innerHTML = '';
        let hasValidChar = false;

        orderedCharList.forEach(c => {
            const validItems = globalCharData[c];
            if (!validItems || validItems.length === 0) return;

            hasValidChar = true;
            const firstItem = validItems[0];

            const card = document.createElement('div');
            card.className = 'char-card';
            card.onclick = () => openModal(c);
            
            card.innerHTML = `
                <div class="img-wrapper">
                    <img src="${firstItem.url}" alt="${c}" loading="lazy">
                </div>
                <div class="char-card-info">
                    <div class="char-card-title">캐릭터: ${c}</div>
                    <div class="char-card-badge">유효: ${validItems.length}장</div>
                </div>
            `;
            gallery.appendChild(card);
        });

        if (!hasValidChar) {
            gallery.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 2rem;">유효한 이미지가 없습니다.</div>';
        }
    }

    function openModal(char) {
        const modal = document.getElementById('detailModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalGrid = document.getElementById('modalGrid');
        const items = globalCharData[char] || [];

        modalTitle.innerText = `캐릭터 [ ${char} ] 미리보기`;
        modalGrid.innerHTML = '';

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'modal-card';
            card.innerHTML = `
                <div class="img-wrapper" onclick="openZoomModal('${item.url}')">
                    <img src="${item.url}" alt="${char}">
                </div>
                <div class="modal-card-info">
                    <div style="color:#38bdf8; font-weight:bold;">의상: ${item.outfit || '없음'} / 상황: ${item.situation}</div>
                    <button class="btn-copy-single" onclick="copySingleUrl('${item.url}')">📋 URL 복사</button>
                </div>
            `;
            modalGrid.appendChild(card);
        });

        modal.style.display = 'flex';
    }

    /* 💡 개별 이미지 URL 복사 함수 */
    function copySingleUrl(url) {
        navigator.clipboard.writeText(url).then(() => {
            alert('이미지 URL이 클립보드에 복사되었습니다!\n' + url);
        }).catch(() => {
            prompt('아래 URL을 복사하세요:', url);
        });
    }

    function openInvalidModal() {
        const modal = document.getElementById('invalidModal');
        const tbody = document.getElementById('invalidTableBody');
        tbody.innerHTML = '';

        if (invalidImgList.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#94a3b8; padding:1.5rem;">제외되거나 오류가 발생한 URL이 없습니다.</td></tr>`;
        } else {
            invalidImgList.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.char} / ${item.outfit || '-'} / ${item.situation}</td>
                    <td style="color:#f87171;">${item.reason}</td>
                    <td class="invalid-url-text"><a href="${item.url}" target="_blank" style="color:#93c5fd;">${item.url}</a></td>
                `;
                tbody.appendChild(tr);
            });
        }

        modal.style.display = 'flex';
    }

    function copyInvalidUrls() {
        if (invalidImgList.length === 0) {
            alert('복사할 오류 URL이 없습니다.');
            return;
        }
        const textToCopy = invalidImgList.map(item => `[${item.reason}] ${item.url}`).join('\n');
        navigator.clipboard.writeText(textToCopy).then(() => {
            alert('제외된 URL 목록이 클립보드에 복사되었습니다.');
        }).catch(() => {
            prompt('아래 텍스트를 복사하세요:', textToCopy);
        });
    }

    function copyShareUrl() {
        const char = encodeURIComponent(document.getElementById('charCode').value);
        const outfit = encodeURIComponent(document.getElementById('outfitCode').value);
        const sit = encodeURIComponent(document.getElementById('situationCode').value);
        const url = encodeURIComponent(document.getElementById('templateUrl').value);

        const shareUrl = `${window.location.origin}${window.location.pathname}?char=${char}&outfit=${outfit}&sit=${sit}&url=${url}`;
        
        navigator.clipboard.writeText(shareUrl).then(() => {
            alert('공유 URL이 클립보드에 복사되었습니다!');
        }).catch(() => {
            prompt('아래 URL을 복사하세요:', shareUrl);
        });
    }

    function downloadFileList() {
        const char = document.getElementById('charCode').value;
        const outfit = document.getElementById('outfitCode').value;
        const sit = document.getElementById('situationCode').value;
        const url = document.getElementById('templateUrl').value;

        const shareUrl = `${window.location.origin}${window.location.pathname}?char=${encodeURIComponent(char)}&outfit=${encodeURIComponent(outfit)}&sit=${encodeURIComponent(sit)}&url=${encodeURIComponent(url)}`;

        const htmlContent = `[InternetShortcut]\nURL=${shareUrl}`;
        const blob = new Blob([htmlContent], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `캐릭터챗_미리보기.url`;
        a.click();
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function openZoomModal(url) { document.getElementById('zoomImg').src = url; document.getElementById('zoomModal').style.display = 'flex'; }
    function closeZoomModal() { document.getElementById('zoomModal').style.display = 'none'; }
</script>
</body>
</html>
